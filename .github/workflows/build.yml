name: Build resume

# Pull requests run CI once, on the pull_request event. Pushes run it only on
# main and on release tags, so a pull request's branch isn't built twice.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  # The install paths depend on Homebrew, CTAN and Ubuntu's archive, which change
  # without a commit here. A weekly run catches that before a user does.
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

# Read-only by default. Only the release job can write, to publish a release.
permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run. The
# event is in the group, so the weekly run and a push to main don't cancel
# each other.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, so a new ruff release can't change formatting or fail CI on
      # its own. Update it on purpose.
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Check formatting
        run: ruff format --check
      - name: Lint
        run: ruff check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pdftotext comes with poppler-utils. With it installed, each build
      # checks that the PDF text extracts cleanly, and strict mode fails on
      # any problem.
      - name: Install poppler-utils
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build resume.pdf
        run: ./run --yes
        env:
          CI: "true"
          RESUME_TEXT_CHECK: strict
      - name: Build each example
        run: for f in examples/*.json; do ./run --yes "$f"; done
        env:
          RESUME_TEXT_CHECK: strict
      - name: Check that every PDF is one page and uses the bundled fonts
        run: .github/check-pdfs.sh resume.pdf examples/*.pdf
      - name: Package the release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="resume-generator-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp -r resume.json run build.py resume.tex README.md LICENSE examples fonts "$name/"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumes
          path: |
            resume.pdf
            examples/*.pdf
            resume-generator-*.zip

  # A bare TeX Live with only the LaTeX packages run installs and no font
  # packages, like a fresh BasicTeX. The bundled fonts must be enough.
  minimal-tex:
    runs-on: ubuntu-latest
    # A CTAN mirror once hung the TeX Live install for 14 minutes. Without a
    # limit, a job can run for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live with scheme-basic
        # mirror.ctan.org redirects to a random mirror. A bad one has failed this
        # step three ways: a broken TLS certificate, a refused connection, and an
        # install that hung. Each try gets a new mirror and gives up on a slow
        # one, and the installer, and tlmgr after it, use the mirror that worked.
        run: |
          set -euo pipefail
          base=https://mirror.ctan.org/systems/texlive/tlnet
          texdir="$RUNNER_TEMP/texlive"
          for try in 1 2 3 4 5; do
            rm -rf install-tl install-tl.tar.gz "$texdir"
            mkdir install-tl
            url=""
            if url="$(curl -fsSL --connect-timeout 20 --max-time 120 -o install-tl.tar.gz \
                -w '%{url_effective}' "$base/install-tl-unx.tar.gz")" &&
              tar -xzf install-tl.tar.gz -C install-tl --strip-components=1 &&
              timeout 300 install-tl/install-tl --no-interaction --scheme scheme-basic \
                --repository "${url%/install-tl-unx.tar.gz}" \
                --texdir "$texdir" --no-doc-install --no-src-install > /dev/null; then
              break
            fi
            [ "$try" -lt 5 ] || { echo "::error::TeX Live install failed on 5 mirrors."; exit 1; }
            echo "Try $try failed (mirror: ${url:-none}). Trying another mirror."
            sleep $((try * 5))
          done
          echo "Using $url"
          echo "$texdir/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Build each example
        run: for f in examples/*.json; do ./run --yes "$f"; done
      - name: Check that every PDF is one page and uses the bundled fonts
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          .github/check-pdfs.sh examples/*.pdf

  macos-basictex:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install BasicTeX
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
      - name: Build each example
        run: for f in examples/*.json; do ./run --yes "$f"; done
      - name: Check that every PDF is one page and uses the bundled fonts
        run: |
          brew install poppler
          .github/check-pdfs.sh examples/*.pdf

  # The release ships run, so it waits for every install path to pass, not
  # only the Ubuntu build.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build, minimal-tex, macos-basictex]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resumes
      - name: Create or update the GitHub release
        run: |
          assets=("resume-generator-${GITHUB_REF_NAME}.zip" "examples/alex.pdf#Sample resume (alex.pdf)")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes "${assets[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
