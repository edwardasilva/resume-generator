name: Build resume

# Pull requests run CI once, on the pull_request event. Pushes run it only on
# main and on release tags, so a pull request's branch isn't built twice.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Read-only by default. Only the release job can write, to publish a release.
permissions:
  contents: read

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, so a new ruff release can't change formatting or fail CI on
      # its own. Update it on purpose.
      - name: Install ruff
        run: pip install ruff==0.16.9
      - name: Check formatting
        run: ruff format --check
      - name: Lint
        run: ruff check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pdftotext comes with poppler-utils. With it installed, each build
      # checks that the PDF text extracts cleanly, and strict mode fails on
      # any problem.
      - name: Install poppler-utils
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build resume.pdf
        run: ./run --yes
        env:
          CI: "true"
          RESUME_TEXT_CHECK: strict
      - name: Build each example
        run: for f in examples/*.json; do ./run --yes "$f"; done
        env:
          RESUME_TEXT_CHECK: strict
      - name: Check that every PDF is one page and uses the bundled fonts
        run: .github/check-pdfs.sh resume.pdf examples/*.pdf
      - name: Package the release zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="resume-generator-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp -r resume.json run build.py resume.tex README.md LICENSE examples fonts "$name/"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumes
          path: |
            resume.pdf
            examples/*.pdf
            resume-generator-*.zip

  # A bare TeX Live with only the LaTeX packages run installs and no font
  # packages, like a fresh BasicTeX. The bundled fonts must be enough.
  minimal-tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live with scheme-basic
        # mirror.ctan.org redirects to a random mirror, and one with a broken
        # TLS certificate fails the download. Each retry gets a new mirror.
        # The installer, and tlmgr after it, then use the mirror that worked.
        run: |
          set -euo pipefail
          base=https://mirror.ctan.org/systems/texlive/tlnet
          for try in 1 2 3 4 5; do
            if url="$(curl -fsSL --max-time 300 -o install-tl.tar.gz \
              -w '%{url_effective}' "$base/install-tl-unx.tar.gz")"; then
              break
            fi
            [ "$try" -lt 5 ] || exit 1
            sleep $((try * 5))
          done
          echo "Using $url"
          tar -xzf install-tl.tar.gz
          install-tl-*/install-tl --no-interaction --scheme scheme-basic \
            --repository "${url%/install-tl-unx.tar.gz}" \
            --texdir "$RUNNER_TEMP/texlive" --no-doc-install --no-src-install > /dev/null
          echo "$RUNNER_TEMP/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Build each example
        run: for f in examples/*.json; do ./run --yes "$f"; done
      - name: Check that every PDF is one page and uses the bundled fonts
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          .github/check-pdfs.sh examples/*.pdf

  macos-basictex:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install BasicTeX
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
      - name: Build each example
        run: for f in examples/*.json; do ./run --yes "$f"; done
      - name: Check that every PDF is one page and uses the bundled fonts
        run: |
          brew install poppler
          .github/check-pdfs.sh examples/*.pdf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resumes
      - name: Create or update the GitHub release
        run: |
          assets=("resume-generator-${GITHUB_REF_NAME}.zip" "examples/alex.pdf#Sample resume (alex.pdf)")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes "${assets[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
