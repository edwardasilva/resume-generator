name: Build resume

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build resume.pdf
        run: ./run --yes
        env:
          CI: "true"
      - name: Check that each example fits on one page
        run: for f in examples/*.json; do ./run --yes "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: "*.pdf"
