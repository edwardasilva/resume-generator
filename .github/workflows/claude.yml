name: Claude

# Claude Code works an issue and answers review feedback. Add the claude label to an issue, or
# comment @claude on an issue, a pull request, or a review. Only the repo owner's labels and comments start
# it, so a stranger cannot run it on a public repo. Claude works on a claude/ branch and opens a
# pull request. It never pushes to main, merges, tags, or releases. Workflows run from main, so
# this file does nothing until it merges.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    if: >-
      (github.event_name == 'issues' &&
        github.event.label.name == 'claude' &&
        github.event.sender.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == github.repository_owner &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == github.repository_owner &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs only on the explicit triggers above, never on every push or pull request, to save
    # usage. A newer @claude on the same issue or pull request cancels the older run. This sits
    # on the job, not the workflow, so a skipped event such as Claude's own progress comment
    # never joins the group and cannot cancel the run that is working.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # id-token lets the action trade the run's OIDC token for a Claude GitHub App token.
    # actions: read lets Claude read CI results on its pull requests.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install ruff
        run: pip install ruff==0.16.9

      - uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          # A Claude Max login made with `claude setup-token`, not an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          branch_prefix: claude/
          # Only the owner's comments and Claude's own reach Claude as context.
          include_comments_by_actor: ${{ github.repository_owner }},claude[bot]
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(ruff format:*),Bash(ruff check:*),Bash(shellcheck:*),Bash(python3 -c:*),Bash(./run:*),Bash(.github/check-pdfs.sh:*),Bash(sudo apt-get install -y --no-install-recommends poppler-utils),Bash(pdfinfo:*),Bash(pdftotext:*),Bash(pdftoppm:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git restore:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git fetch:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh release:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh api:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push -u origin main:*),Bash(git push --tags:*),Bash(git push --delete:*),Bash(git push origin --delete:*),Bash(git push -f:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git pull:*),Bash(env:*),Bash(printenv:*)"
            --append-system-prompt 'You are the Claude Code GitHub Action, working in resume-generator. Read README.md, mainly its Contributing section before you change anything, and follow them. Work only on your own claude/ branch, or on the branch of the pull request you were called on. Never push to main, never force-push, never rebase, never merge a pull request, never create or push a tag, and never create a release. A merge is always a squash merge, and the repo owner does it. A release is cut only when the owner asks. When you start from an issue, finish by opening a pull request into main with gh pr create. Fill in .github/pull_request_template.md if the repo has one. The body must name the issue on a line of its own as Part of #N, and must also have the line Closes #N. When you are called on a pull request, push the fix to that pull request branch, and answer every question in your comment. Keep each pull request to one change. Run the checks the rules name before you push. Do not use emojis anywhere. Keep examples neutral, such as Alex Doe with they and them. Run ruff format and ruff check before you push, and shellcheck run .github/check-pdfs.sh if you touch either script. Never invent resume content. The examples use made-up people. Run commands plainly, without pipes or redirects, so they match the allowed list. To check a PDF, run ./run --yes examples/<name>.json, install poppler-utils with the allowed apt-get command, run pdftoppm -png -r 80 on the PDF into /tmp, and read the PNG files. Never print environment variables or secrets.'
